variables:
  AZURE_SERVICE: segy-to-zgy-conversion
  AZURE_DEPLOYMENTS_SUBDIR: deployments/scripts/azure
  AZURE_CLIENT_ID: ${AZURE_PRINCIPAL_ID}
  AZURE_CLIENT_SECRET: ${AZURE_PRINCIPAL_SECRET}
  AZURE_AD_APP_RESOURCE_ID: ${AZURE_APP_ID}
  AZURE_SKIP_END_TO_END_POSTMAN_TESTS: "true" # E2E failing for more than 1yr.
  AZURE_PUBLISH_PARSER_IMAGE: "true" 
  AZURE_PUBLISH_DAG_IMAGE: "true" 

  #IBM
  IBM_HELM_DAG_PATH: devops/ibm/ibm-zgy-dag

stages:
  - review
  - build
  - test
  - containerize
  - scan
  - bootstrap_dag
  - deploy
  - bootstrap
  - integration
  - end_to_end_postman_tests
  - deploy_preship
  - attribution
  - publish

include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/azure_dag.yml"
  
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/cimpl-containerize.yml"

  - local: "/devops/azure/override-stages.yml"

  # Disable this step until it is fixed
  # - local: "/devops/ibm/ibm-stages.yml"

  - local: "/devops/build-sdk/build-segysdk.yml"

  # Override pipeline logic for CIMPL
  - local: "devops/core-plus/pipeline/override-stages.yml"
