schemaVersion: 4
service:
  name: zgy-converter
  archetype: native-container-azure
  sourcePath: .
  image:
    context: .
    dockerfile: .spi/image/Dockerfile
    platforms: linux/amd64
  companion:
    name: dag
    kind: airflow-dag
    packageSuffix: -dag-image
    sourcePath: .spi/runtime
    pythonVersion: "3.12"
    airflowVersion: "3.2.2"
    dagPath: .spi/generated/segy_to_zgy_ingestion_dag.py
    dagId: segy-to-zgy-conversion
    image:
      context: .
      dockerfile: .spi/dag/Dockerfile
tests:
  acceptance:
    type: script
    path: .spi
    entrypoint: acceptance/run.sh
    arguments:
      - "--workflow-url"
      - "${WORKFLOW_URL}"
      - "--partition"
      - "${PARTITION}"
      - "--token"
      - "${TOKEN}"
      - "--workflow-name"
      - "${WORKFLOW_NAME}"
      - "--report"
      - "acceptance/results/workflow.xml"
    reportPaths:
      - acceptance/results/workflow.xml
    dependencies:
      - workflow
    timeoutMinutes: 10
    bindings:
      WORKFLOW_URL: { source: gateway, suffix: /api/workflow/v1 }
      PARTITION: { source: partition }
      TOKEN: { source: token }
      WORKFLOW_NAME: { source: static, value: segy-to-zgy-conversion }
