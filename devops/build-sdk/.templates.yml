.apt-install-base-dev-libs: &apt-install-base-dev-libs
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update && apt-get upgrade --yes
  - apt-get install --yes --no-install-recommends libboost-program-options-dev libc6-dev libcpprest-dev libcurl4-openssl-dev libjsoncpp-dev libpng-dev libssl-dev

.apt-install-build-tools: &apt-install-build-tools
  - apt-get install --yes --no-install-recommends autoconf binutils ca-certificates cmake curl dos2unix doxygen file g++ gcc git libtool make ninja-build tar unzip uuid-dev wget

.build-segy:
  image: ubuntu:focal
  tags: ['osdu-large']
  stage: build
  timeout: 1h 30m
  artifacts:
    name: SegySDK-focal
    expire_in: 1 hours
    paths:
    - UbuntuFocalBinaries
    - UbuntuFocalWheel
    exclude:
    - build/**.timestamp
  variables:
    OPENZGY_BUNDLE_URL: "https://community.opengroup.org/osdu/platform/domain-data-mgmt-services/seismic/open-zgy/-/package_files/4075436/download"
    GCCPACKAGE: "gcc"
    SDAPI_GCCVERSION: "940"
    OPENZGY_GCCVERSION: "94"
    OPENZGY_OUTPUT: "focal-gcc94"
    UBUNTU_NAME: "Focal"
    SEGYSDK_REPO: $CI_BUILDS_DIR/osdu/platform/data-flow/ingestion/segy-to-zgy-conversion/segysdk
    OPENTELEMETRY_CPP_RELEASE: "1.15.0"
    OPENTELEMETRY_CPP_WORKDIR: /tmp/opentelemetry-cpp
  script:
    - *apt-install-base-dev-libs
    - *apt-install-build-tools
    - |
      gcc -dumpfullversion
      mkdir -p $OPENTELEMETRY_CPP_WORKDIR
      cd $OPENTELEMETRY_CPP_WORKDIR
      curl https://github.com/open-telemetry/opentelemetry-cpp/archive/refs/tags/v$OPENTELEMETRY_CPP_RELEASE.tar.gz --location --silent --remote-name
      tar --extract --file v$OPENTELEMETRY_CPP_RELEASE.tar.gz
      cmake -S opentelemetry-cpp-$OPENTELEMETRY_CPP_RELEASE/ -B build/ -DBUILD_TESTING=OFF -DWITH_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF
      cmake --build build/ --parallel 4 --target install
      set -x
      mkdir -p /tmp/openzgy-bundle
      cd /tmp/openzgy-bundle
      curl $OPENZGY_BUNDLE_URL -o /tmp/openzgy-bundle/openzgy.bundle.tar.gz
      tar zxvf openzgy.bundle.tar.gz
      cd /tmp/openzgy-bundle/sdapi/Lin64_$GCCPACKAGE$SDAPI_GCCVERSION
      tar zxvf sdapi_linux64.tar.gz
      # change current folder to segysdk source
      cd $SEGYSDK_REPO
      mkdir -p ./src/out            
      mkdir -p ./src/include/openzgy && cp -r /tmp/openzgy-bundle/native/include  ./src 
      mkdir -p ./src/include/SDAPI   && cp /tmp/openzgy-bundle/sdapi/Lin64_gcc$SDAPI_GCCVERSION/include/*.* ./src/include/SDAPI
      mkdir -p ./src/lib             && cp -r /tmp/openzgy-bundle/native/$OPENZGY_OUTPUT/*.* ./src/lib
      # build
      cd ./src/out

      cmake -GNinja .. -DCMAKE_BUILD_TYPE:STRING=Release -DTREAT_WARNINGS_AS_ERRORS=ON && ninja
      
      SEGY_LOCALTESTDATA_PATH=$SEGYSDK_REPO/testdata/ ctest --output-on-failure
      cp -anv /tmp/openzgy-bundle/native/$OPENZGY_OUTPUT/*.so* ./bin/Release
      # Publish artifacts
      cd $SEGYSDK_REPO
      mkdir -p ../Ubuntu${UBUNTU_NAME}Binaries/bin
      mkdir -p ../Ubuntu${UBUNTU_NAME}Binaries/lib
      cp -anv $SEGYSDK_REPO/src/out/bin/Release/SegyToZgy ../Ubuntu${UBUNTU_NAME}Binaries/bin
      cp -anv $SEGYSDK_REPO/src/out/bin/Release/*.so*     ../Ubuntu${UBUNTU_NAME}Binaries/lib
      #Copy src to the artifacts
      cp -an $SEGYSDK_REPO/src   ../Ubuntu${UBUNTU_NAME}Binaries
      rm -r ../Ubuntu${UBUNTU_NAME}Binaries/src/out  ../Ubuntu${UBUNTU_NAME}Binaries/src/lib

