.test-python:
  image: ubuntu:focal
  tags: ['osdu-medium']
  stage: test
  artifacts:
    name: SegySDK-focal
    expire_in: 1 hours
    paths:
    - UbuntuFocalWheel
  variables:
    WORKDIR: python-verfiy-tmp
    VENV: "$WORKDIR/venv"
    PYTHONVERSION: ''
    UBUNTU_NAME: "Focal"
  before_script:
    - *apt-install-base-dev-libs
    - |
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          apt-get install --yes software-properties-common
          add-apt-repository --yes ppa:deadsnakes/ppa
      fi
    - |
      set -x
      apt-get install --yes python$PYTHONVERSION python3-pip
      ln -s /usr/bin/python$PYTHONVERSION /usr/bin/python
    - |
      #Install setuptools
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          echo "Create virtual env"
          python -m pip install virtualenv
          apt-get install --yes python3.10-venv
          python -m venv $VENV
          source $VENV/bin/activate
          python -m pip install --upgrade virtualenv --upgrade pip
      else
          python -m pip install --upgrade virtualenv --upgrade pip
          python -m virtualenv $VENV
      fi
    - |
      
      export SD_SVC_URL='https://www.dummy.com/seistore-svc/api/v3'
      export SD_SVC_TOKEN='Dummy-token value'
      ls -laR Ubuntu${UBUNTU_NAME}Binaries
  script:
    - |
      set -e
      mkdir -p python-verfiy-tmp
      cp Ubuntu${UBUNTU_NAME}Wheel/*.whl  $WORKDIR
      if [[ "$UBUNTU_NAME" != "Noble" ]]; then
          source $VENV/bin/activate
      fi
      ( for q in $WORKDIR/*.whl ; do pip install $q ; done )
      pip install pytest
      pytest segysdk/python-wrapper/tests

# Since Python 3.6 and Python 3.7 cannot be installed on Ubuntu focal by default (python 3.8 will always be installed).
# Have to do tricks. Separate template to install python 3.6, 3.7, where are these installed via pyenv.
.test-python367:
  extends: .test-python
  before_script:
    - *apt-install-base-dev-libs
    - *apt-install-build-tools
    - |
      set -x
      apt-get install --yes --no-install-recommends build-essential libbz2-dev libffi-dev liblzma-dev libncursesw5-dev libreadline-dev libsqlite3-dev libxml2-dev libxmlsec1-dev llvm tk-dev xz-utils zlib1g-dev
      # install pyenv
      curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
      export PATH="$HOME/.pyenv/bin:$PATH"
      pyenv install $PYTHONVERSION
      pyenv virtualenv $PYTHONVERSION general
      pyenv global general
      # short version of python to create a symlink
      PYTHONVER=$(echo $file | cut -f1-2 -d ".")
      ln -s /root/.pyenv/versions/$PYTHONVERSION/bin/python$PYTHONVER /usr/bin/python
      python --version
      python -m pip install --upgrade virtualenv --upgrade pip
      python -m virtualenv $VENV
      export SD_SVC_URL='https://www.dummy.com/seistore-svc/api/v3'
      export SD_SVC_TOKEN='Dummy-token value'

.publish-python:
  image: ubuntu:focal
  tags: ['osdu-small']
  stage: publish
  variables:
    UBUNTU_NAME: "Focal"
  script:
    - *apt-install-base-dev-libs
    - |
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          apt-get install --yes software-properties-common
          add-apt-repository --yes ppa:deadsnakes/ppa
      fi
    - |
      apt-get install --yes tar curl python3.9 python3-pip
      ln -s /usr/bin/python3.9 /usr/bin/python
      #uploud to generic binaries
      tar czvf segysdk-ubuntu-${UBUNTU_NAME}-$CI_PIPELINE_ID.tar.gz Ubuntu${UBUNTU_NAME}Binaries Ubuntu${UBUNTU_NAME}Wheel
      curl -v --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file segysdk-ubuntu-${UBUNTU_NAME}-$CI_PIPELINE_ID.tar.gz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/segysdk/$CI_PIPELINE_ID/segysdk-ubuntu-${UBUNTU_NAME}-$CI_PIPELINE_ID.tar.gz"
      #Upload to pypi
    - |
      #Install setuptools
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          echo "Create virtual env"
          python -m pip install virtualenv
          apt-get install --yes python3.9-venv
          python -m venv ./virtualenv
          source ./virtualenv/bin/activate
      fi
      python -m pip install --upgrade virtualenv --upgrade pip
      pip install twine
      TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi Ubuntu${UBUNTU_NAME}Wheel/*
