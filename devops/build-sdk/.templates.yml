.build-python:
  extends: .build-segy
  variables:
    UBUNTU_VERSION: "20.04"
    UBUNTU_NAME: "Focal"
    PYTHONVERSION: '3.9'
  script:
    - *apt-install-base-dev-libs
    - *apt-install-build-tools
    - |
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          apt-get install --yes software-properties-common
          add-apt-repository --yes ppa:deadsnakes/ppa
      fi
    - |
      # prerequisites for python wrapper build
      apt-get install --yes python${PYTHONVERSION} python3-pip
      ln -s /usr/bin/python${PYTHONVERSION} /usr/bin/python
    - |
      gcc -dumpfullversion
      cd $SEGYSDK_REPO
      # build python wheel
    - |
      #Install setuptools
      if [[ "$UBUNTU_NAME" == "Noble" ]]; then
          echo "Create virtual env"
          python -m pip install virtualenv
          apt-get install --yes python3.10-venv
          python -m venv ./virtualenv
          source ./virtualenv/bin/activate
      fi
      echo "Install basic pip requirements"
      python -m pip install --upgrade pip
      #Install segylibrary requirements
      echo "Install segylibrary requirements"
      python -m pip install -r ./python-wrapper/requirements.txt
    - |
      mkdir -p ./python-wrapper/src/segysdk/dll/ubuntu/$UBUNTU_VERSION
      cp -anv ../Ubuntu${UBUNTU_NAME}Binaries/bin/** ./python-wrapper/src/segysdk/dll/ubuntu/$UBUNTU_VERSION
      cp -anv ../Ubuntu${UBUNTU_NAME}Binaries/lib/** ./python-wrapper/src/segysdk/dll/ubuntu/$UBUNTU_VERSION
      # Create Python wheel
      cd ./python-wrapper/src
      #TODO
      # build number?
      export BUILD_BUILDID=$CI_PIPELINE_ID
      python setup.py bdist_wheel --plat-name linux-x86_64 --build-number $CI_JOB_ID
      # copy wheel artifact
      cd $SEGYSDK_REPO
      mkdir -p ../Ubuntu${UBUNTU_NAME}Wheel
      cp ./python-wrapper/src/dist/*  ../Ubuntu${UBUNTU_NAME}Wheel

