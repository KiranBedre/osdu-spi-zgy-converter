--- 
.azure_variables: 
  variables: 
    AZURE_AD_APP_RESOURCE_ID: $AZURE_APP_ID
    AZURE_AD_TENANT_ID: $AZURE_TENANT_ID
    AZURE_CLIENT_ID: $AZURE_PRINCIPAL_ID
    AZURE_CLIENT_SECRET: $AZURE_PRINCIPAL_SECRET
    DATA_PARTITION_ID: opendes
    SHARED_TENANT: opendes
    WORKFLOW_URL: "https://${AZURE_DNS_NAME}/api/workflow/v1/"

azure_standalone_tests:
  stage: test
  needs: []
  variables:
    AZURE_SKIP_STANDALONE_TESTS: "true"

azure_build_dag:
  needs: []
  artifacts: 
    expire_in: "2 days"
    paths: 
      - output_dags
  before_script: 
    - |
      if [ ! -z "$CI_COMMIT_TAG" ]; then
        DAG_TASK_IMAGE="${CI_PROJECT_NAME}:${CI_COMMIT_SHA}"
      fi
    - "az login --service-principal -u $AZURE_PRINCIPAL_ID -p $AZURE_PRINCIPAL_SECRET --tenant $AZURE_TENANT_ID"
    - "az aks get-credentials -g $AZURE_UNIQUE-rg -n $AZURE_UNIQUE-aks"
    - "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - |
      # Generating environment file to be passed while running the docker container
      cat > .env << EOF
      CI_REGISTRY_USER=${CI_REGISTRY_USER}
      CI_REGISTRY_PASSWORD=${CI_REGISTRY_PASSWORD}
      CI_REGISTRY=${CI_REGISTRY}
      AZURE_DNS_NAME=$AZURE_DNS_NAME
      AZURE_REGISTRY=${AZURE_REGISTRY}
      AZURE_PRINCIPAL_ID=${AZURE_PRINCIPAL_ID}
      AZURE_PRINCIPAL_SECRET=${AZURE_PRINCIPAL_SECRET}
      AZURE_TENANT_ID=${AZURE_TENANT_ID}
      CI_PROJECT_NAME=${CI_PROJECT_NAME}
      CI_COMMIT_REF_SLUG=${CI_COMMIT_REF_SLUG}
      CI_COMMIT_SHA=${CI_COMMIT_SHA}
      CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
      AZURE_DEPLOYMENTS_SCRIPTS_SUBDIR=${AZURE_DEPLOYMENTS_SCRIPTS_SUBDIR}
      DAG_TASK_IMAGE=${DAG_TASK_IMAGE}
      EOF
  extends: 
    - .azure_variables
  image: danielscholl/azure-build-image
  only: 
    variables: 
      - "$AZURE == '1'"
  script: 
    - |
        az acr login -n $AZURE_REGISTRY

        docker build -t $CI_REGISTRY_IMAGE/$DAG_TASK_IMAGE --file deployments/scripts/azure/dockerFolder/task_dockerfile .
        docker push $CI_REGISTRY_IMAGE/$DAG_TASK_IMAGE
        docker tag $CI_REGISTRY_IMAGE/$DAG_TASK_IMAGE ${AZURE_REGISTRY}.azurecr.io/$DAG_TASK_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$DAG_TASK_IMAGE

        docker build -t $CI_REGISTRY_IMAGE/$DAG_LOAD_IMAGE --file deployments/scripts/azure/dockerFolder/output_dags_dockerfile  .
        docker push $CI_REGISTRY_IMAGE/$DAG_LOAD_IMAGE
        docker tag $CI_REGISTRY_IMAGE/$DAG_LOAD_IMAGE ${AZURE_REGISTRY}.azurecr.io/$DAG_LOAD_IMAGE
        docker push ${AZURE_REGISTRY}.azurecr.io/$DAG_LOAD_IMAGE

    - |
      # Checking if container with name docker_generate_dags exists then delete
      # Container with a name is required to perform the copy operation below

      if [ "$(docker ps -a | grep docker_generate_dags)" ]; then
        docker stop docker_generate_dags
        docker rm docker_generate_dags
      fi


    - docker run --name "docker_generate_dags" -v /var/run/docker.sock:/var/run/docker.sock --env-file .env $CI_REGISTRY_IMAGE/$DAG_LOAD_IMAGE


    # Copying the dag folder from the docker container to he host
    - docker cp "docker_generate_dags:/home/osdu/output_dags" .
  stage: containerize
  tags: 
    - osdu-large
  variables: 
    DAG_LOAD_IMAGE: "${CI_PROJECT_NAME}-dag-${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}"
    DAG_TASK_IMAGE: "${CI_PROJECT_NAME}:${CI_COMMIT_SHA}"

azure_dag_postman_tests:
  before_script:
    - |
      # Generating environment file to be passed while running the postman tests
      cat > python_env_vars.txt << EOF
      TENANT_ID os.environ.get('AZURE_TENANT_ID')
      CLIENT_ID os.environ.get('CLIENT_ID')
      CLIENT_SECRET os.environ.get('CLIENT_SECRET')
      HOSTNAME os.environ.get('AZURE_DNS_NAME')
      refresh_token os.environ.get('AZURE_REFRESH_TOKEN')
      WORKFLOW_HOST os.environ.get('AZURE_DNS_NAME')
      segy_to_zgy_DAG_name os.environ.get('DAG_NAME')
      EOF
    - |
      export BUILD_VERSION=$(echo ${CI_COMMIT_SHA} | cut -c -5)
      export DAG_NAME="segy-to-zgy-conversion"
